# TODO(scale): Set worker_processes auto and size worker_connections plus the
# file-descriptor limit for target concurrency; each session uses four proxy
# connections across its two WebSockets.
events { worker_connections 1024; }

http {
    upstream remotemaster {
        # TODO(perf): Add an upstream keepalive pool and HTTP/1.1 connection
        # reuse for non-WebSocket requests to avoid a new app-side TCP connection.
        server remotemaster:8080;
    }

    # Redirect HTTP → HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name your.domain.com;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # WebSocket upgrade support
        location /ws/ {
            proxy_pass         http://remotemaster;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Forwarded-Host $host;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Static files and API
        location / {
            proxy_pass       http://remotemaster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Forwarded headers let the server emit wss:// URLs (launch.ps1) and
            # rate-limit by real client IP. The server only trusts them when
            # started with TRUST_PROXY_HEADERS=1 — set that on the app container.
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
